[build]
builder = "NIXPACKS"

[deploy]
preDeployCommand = "cd app/backend && PYTHONPATH=. /app/.venv/bin/python -m alembic upgrade head"
startCommand = "cd app/backend && PYTHONPATH=. /app/.venv/bin/python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
