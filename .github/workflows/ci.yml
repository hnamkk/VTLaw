name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtlaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vtlaw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      OPENAI_API_KEY: test-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vtlaw_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vtlaw_test
      PYTHONPATH: app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint backend
        run: ruff check app/backend/src/ app/backend/tests/

      - name: Apply migrations to an empty database
        working-directory: app/backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest app/backend/tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: app/frontend
        run: npm run lint

      - name: Build production frontend
        working-directory: app/frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
