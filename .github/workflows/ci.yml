name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r app/backend/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint with ruff
        run: ruff check app/backend/src/ app/backend/tests/

      - name: Run tests
        run: PYTHONPATH=app/backend pytest app/backend/tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
